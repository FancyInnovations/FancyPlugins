name: Build and test

on:
  push:
  pull_request:
    types:
      - opened
jobs:
  build-plugins:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Modify gradlew permissions
        run: chmod +x ./gradlew

      - name: Build FancyNpcs v2
        run: ./gradlew :plugins:fancynpcs-v2:shadowJar

      #      - name: Build FancyNpcs
      #        run: ./gradlew :plugins:fancynpcs:shadowJar

      - name: Build FancyNpcsModel
        run: ./gradlew :plugins:fancynpcs-model:shadowJar

      - name: Build FancyHolograms v2
        run: ./gradlew :plugins:fancyholograms-v2:shadowJar

      - name: Build FancyHolograms v3
        run: ./gradlew :plugins:fancyholograms:shadowJar

      - name: Build FancyDialogs
        run: ./gradlew :plugins:fancydialogs:shadowJar

      - name: Build FancyWorlds
        run: ./gradlew :plugins:fancyworlds:shadowJar

      - name: Build FancyEconomy
        run: ./gradlew :plugins:fancyeconomy:shadowJar

      - name: Build FancyVisuals
        run: ./gradlew :plugins:fancyvisuals:shadowJar

  build-libraries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Modify gradlew permissions
        run: chmod +x ./gradlew

      - name: Build common
        run: ./gradlew :libraries:common:jar

      - name: Build config
        run: ./gradlew :libraries:config:jar

      - name: Build jdb
        run: ./gradlew :libraries:jdb:jar

      - name: Build packets
        run: ./gradlew :libraries:packets:shadowJar

      - name: Build plugin-tests
        run: ./gradlew :libraries:plugin-tests:jar

